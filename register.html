<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — EstatePro Luxury Real Estate</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ========== GLOBAL RESET ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    :root {
      --bg-body: #faf8ff;
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: #ede5fa;
      --input-bg: #fdfcff;
      --input-border: #e2d5f8;
      --text-primary: #1e1033;
      --text-secondary: #58496e;
      --text-muted: #887a9e;

      --brand: #7c3aed;
      --brand-dark: #6d28d9;
      --brand-light: #a855f7;
      --brand-accent: #ec4899;
      --brand-soft: rgba(124, 58, 237, 0.12);

      --shadow-portal: 0 25px 65px rgba(124, 58, 237, 0.12), 0 0 0 1px #ede5fa;
      --success: #10b981;
    }

    body.dark {
      --bg-body: #0a0414;
      --card-bg: rgba(20, 10, 36, 0.9);
      --card-border: rgba(168, 85, 247, 0.28);
      --input-bg: rgba(12, 5, 22, 0.85);
      --input-border: rgba(168, 85, 247, 0.24);
      --text-primary: #f8f6fc;
      --text-secondary: #c9bedb;
      --text-muted: #8e80a8;

      --shadow-portal: 0 30px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(168, 85, 247, 0.2);
    }

    html, body {
      min-height: 100vh;
      width: 100%;
      background-color: var(--bg-body);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s, color 0.3s;
      position: relative;
      overflow-x: hidden;
      padding: 30px 0;
    }

    /* Ambient Background Glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.18) 0%, rgba(236, 72, 153, 0.1) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: 10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    /* ========== RIGHT SIDE CONTROLS (DARK MODE & RTL) ========== */
    .register-right-controls {
      position: fixed;
      top: 24px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
    }

    html[dir="rtl"] .register-right-controls {
      right: auto;
      left: 28px;
    }

    .outline-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: all 0.25s ease;
    }

    .outline-pill:hover {
      border-color: var(--brand);
      color: var(--brand);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
    }

    .outline-pill i {
      font-size: 0.9rem;
    }

    /* Centered Register Card */
    .register-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 490px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .register-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 42px 36px;
      box-shadow: var(--shadow-portal);
      transition: all 0.3s ease;
    }

    /* Brand Header */
    .register-card-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      text-decoration: none;
      cursor: pointer;
      color: inherit;
      transition: transform 0.25s ease;
    }

    .register-card-brand:hover {
      transform: translateY(-2px);
    }

    .register-card-brand:hover .register-logo-box {
      transform: scale(1.06) rotate(3deg);
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.45);
    }

    .register-logo-box {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--brand), var(--brand-accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.25rem;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
      transition: all 0.3s ease;
    }

    .register-logo-text {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .register-logo-text span {
      background: linear-gradient(135deg, var(--brand-light), var(--brand-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .register-header-text {
      text-align: center;
      margin-bottom: 24px;
    }

    .register-header-text h1 {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.6px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .register-header-text p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Role Switcher Tabs */
    .role-tabs {
      display: flex;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 22px;
      gap: 4px;
    }

    .role-tab-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .role-tab-btn.active {
      background: linear-gradient(135deg, var(--brand), var(--brand-accent));
      color: #fff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap i.input-icon {
      position: absolute;
      left: 15px;
      color: var(--text-muted);
      font-size: 0.92rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 15px 13px 44px;
      border-radius: 13px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-wrap input:focus {
      border-color: var(--brand-light);
      box-shadow: 0 0 0 4px var(--brand-soft);
    }

    .input-wrap input:focus + .input-icon {
      color: var(--brand-light);
    }

    .toggle-password-btn {
      position: absolute;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.92rem;
      cursor: pointer;
      padding: 5px;
      transition: color 0.2s;
    }

    .toggle-password-btn:hover { color: var(--brand-light); }

    /* Terms Row */
    .terms-row {
      margin: 18px 0 22px;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .terms-check {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .terms-check input[type="checkbox"] {
      accent-color: var(--brand);
      width: 16px;
      height: 16px;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .terms-check a {
      color: var(--brand-light);
      text-decoration: none;
      font-weight: 700;
    }

    .terms-check a:hover { color: var(--brand-accent); }

    /* Submit Button */
    .btn-submit-register {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--brand), var(--brand-accent));
      color: #fff;
      font-size: 0.96rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
      transition: all 0.25s ease;
      letter-spacing: 0.2px;
    }

    .btn-submit-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(124, 58, 237, 0.55);
    }

    .btn-submit-register:active { transform: translateY(0); }

    .btn-submit-register i.spinner {
      display: none;
      animation: fa-spin 1s infinite linear;
    }

    /* Social Dividers */
    .social-divider {
      display: flex;
      align-items: center;
      margin: 24px 0 18px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .social-divider::before,
    .social-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--input-border);
    }

    .social-divider span { padding: 0 12px; }

    .social-auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .social-auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .social-auth-btn:hover {
      border-color: var(--brand-light);
      background: var(--brand-soft);
      transform: translateY(-2px);
    }

    .register-card-footer {
      text-align: center;
      font-size: 0.86rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--input-border);
      padding-top: 20px;
    }

    .register-card-footer a {
      color: var(--brand-light);
      font-weight: 800;
      text-decoration: none;
      margin-left: 4px;
    }

    .register-card-footer a:hover { color: var(--brand-accent); }

    /* ========== RTL SUPPORT ========== */
    html[dir="rtl"] { direction: rtl; }
    html[dir="rtl"] .input-wrap i.input-icon {
      left: auto;
      right: 15px;
    }
    html[dir="rtl"] .input-wrap input {
      padding: 13px 44px 13px 15px;
    }
    html[dir="rtl"] .toggle-password-btn {
      right: auto;
      left: 14px;
    }
    html[dir="rtl"] .btn-submit-register i.fa-arrow-right {
      transform: scaleX(-1);
    }
    html[dir="rtl"] .register-toast {
      right: auto;
      left: 26px;
    }

    /* Toast Notification */
    .register-toast {
      position: fixed;
      bottom: 26px;
      right: 26px;
      background: #10b981;
      color: #fff;
      padding: 14px 22px;
      border-radius: 13px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
      z-index: 2000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .register-toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 580px) {
      .register-right-controls {
        top: 14px;
        right: 16px;
      }
      html[dir="rtl"] .register-right-controls {
        right: auto;
        left: 16px;
      }
      .outline-pill {
        padding: 7px 12px;
        font-size: 0.76rem;
      }
      .register-card { padding: 32px 22px; border-radius: 20px; }
      .register-header-text h1 { font-size: 1.6rem; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>

  <!-- Right Side Fixed Utility Controls (Dark Mode & RTL Toggles) -->
  <aside class="register-right-controls">
    <button class="outline-pill" id="darkModeBtn" type="button" aria-label="Toggle Dark Mode">
      <i class="fas fa-moon" id="themeIcon"></i>
      <span id="themeLabel">Dark Mode</span>
    </button>

    <button class="outline-pill" id="rtlBtn" type="button" aria-label="Toggle RTL Direction">
      <i class="fas fa-arrow-right-arrow-left"></i>
      <span id="rtlLabel">RTL / LTR</span>
    </button>
  </aside>

  <!-- Strictly Centered Register Interface (No navbar, no footer) -->
  <main class="register-wrapper">
    <div class="register-card">
      
      <!-- Clickable Brand Emblem Linking to Home -->
      <a href="index.html" class="register-card-brand" title="Back to Homepage">
        <div class="register-logo-box">
          <i class="fas fa-house-chimney"></i>
        </div>
        <div class="register-logo-text">Estate<span>Pro</span>.</div>
      </a>

      <!-- Header Copy -->
      <div class="register-header-text">
        <h1>Create Account</h1>
        <p>Join EstatePro to access curated luxury estates and private escrow.</p>
      </div>

      <!-- Account Role Selection Tabs -->
      <div class="role-tabs">
        <button class="role-tab-btn active" type="button" data-role="client" onclick="switchRole('client')">
          <i class="fas fa-user"></i> Buyer / Client
        </button>
        <button class="role-tab-btn" type="button" data-role="agent" onclick="switchRole('agent')">
          <i class="fas fa-user-tie"></i> Certified Agent
        </button>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label for="regFullName">Full Legal Name</label>
          <div class="input-wrap">
            <input type="text" id="regFullName" placeholder="e.g. Alexander Vance" required autocomplete="name" />
            <i class="fas fa-user input-icon"></i>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <div class="input-wrap">
              <input type="email" id="regEmail" placeholder="name@domain.com" required autocomplete="email" />
              <i class="fas fa-envelope input-icon"></i>
            </div>
          </div>
          <div class="form-group">
            <label for="regPhone">Phone Number</label>
            <div class="input-wrap">
              <input type="tel" id="regPhone" placeholder="+1 (555) 000-0000" required autocomplete="tel" />
              <i class="fas fa-phone input-icon"></i>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="regPassword">Password</label>
            <div class="input-wrap">
              <input type="password" id="regPassword" placeholder="Minimum 8 characters" required autocomplete="new-password" minlength="8" />
              <i class="fas fa-lock input-icon"></i>
              <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('regPassword', 'eyeIcon1')" aria-label="Toggle password view">
                <i class="fas fa-eye" id="eyeIcon1"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <div class="input-wrap">
              <input type="password" id="regConfirmPassword" placeholder="Repeat password" required autocomplete="new-password" minlength="8" />
              <i class="fas fa-shield-halved input-icon"></i>
              <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('regConfirmPassword', 'eyeIcon2')" aria-label="Toggle confirm password view">
                <i class="fas fa-eye" id="eyeIcon2"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="terms-row">
          <label class="terms-check">
            <input type="checkbox" id="termsCheck" required />
            <span>I agree to EstatePro's <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn-submit-register" id="regSubmitBtn">
          <i class="fas fa-circle-notch spinner" id="regSpinner"></i>
          <span id="regBtnText">Create My Account</span>
          <i class="fas fa-arrow-right" id="regArrow"></i>
        </button>
      </form>

      <!-- Social Options -->
      <div class="social-divider">
        <span>Or register with</span>
      </div>

      <div class="social-auth-grid">
        <button type="button" class="social-auth-btn" onclick="socialAuth('Google')">
          <i class="fab fa-google" style="color: #ea4335;"></i> Google
        </button>
        <button type="button" class="social-auth-btn" onclick="socialAuth('Apple')">
          <i class="fab fa-apple"></i> Apple ID
        </button>
      </div>

      <!-- Link to Login -->
      <div class="register-card-footer">
        Already have an EstatePro account?
        <a href="login.html">Sign In here</a>
      </div>

    </div>
  </main>

  <!-- Toast Notification -->
  <div class="register-toast" id="regToast">
    <i class="fas fa-circle-check" style="font-size: 1.25rem;"></i>
    <span id="toastMessage">Account created successfully! Welcome to EstatePro.</span>
  </div>

  <script>
    /* ========== DARK / LIGHT MODE ========== */
    const body = document.body;
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');
    const darkModeBtn = document.getElementById('darkModeBtn');

    function applyTheme(isDark) {
      if (isDark) {
        body.classList.add('dark');
        if (themeIcon) themeIcon.classList.replace('fa-moon', 'fa-sun');
        if (themeLabel) themeLabel.textContent = 'Light Mode';
      } else {
        body.classList.remove('dark');
        if (themeIcon) themeIcon.classList.replace('fa-sun', 'fa-moon');
        if (themeLabel) themeLabel.textContent = 'Dark Mode';
      }
    }

    applyTheme(localStorage.getItem('theme') === 'dark');

    function toggleTheme() {
      const isDark = !body.classList.contains('dark');
      applyTheme(isDark);
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (darkModeBtn) darkModeBtn.addEventListener('click', toggleTheme);

    /* ========== RTL / LTR ========== */
    const rtlBtn = document.getElementById('rtlBtn');
    const rtlLabel = document.getElementById('rtlLabel');

    function applyDirection(isRtl) {
      if (isRtl) {
        document.documentElement.setAttribute('dir', 'rtl');
        document.body.classList.add('rtl');
        if (rtlLabel) rtlLabel.textContent = 'LTR / RTL';
      } else {
        document.documentElement.setAttribute('dir', 'ltr');
        document.body.classList.remove('rtl');
        if (rtlLabel) rtlLabel.textContent = 'RTL / LTR';
      }
    }

    applyDirection(localStorage.getItem('direction') === 'rtl');

    function toggleDirection() {
      const isRtl = document.documentElement.getAttribute('dir') !== 'rtl';
      applyDirection(isRtl);
      localStorage.setItem('direction', isRtl ? 'rtl' : 'ltr');
    }

    if (rtlBtn) rtlBtn.addEventListener('click', toggleDirection);

    /* ========== ROLE SELECTION ========== */
    let selectedRole = 'client';

    function switchRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });
      const btnText = document.getElementById('regBtnText');
      if (role === 'agent') {
        btnText.textContent = 'Apply as Certified Agent';
      } else {
        btnText.textContent = 'Create My Account';
      }
    }

    /* ========== PASSWORD TOGGLE ========== */
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    /* ========== TOAST ========== */
    function showToast(msg) {
      const toast = document.getElementById('regToast');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function socialAuth(provider) {
      showToast(`Redirecting to secure ${provider} verification...`);
      setTimeout(() => {
        window.location.href = 'user-dashboard.html';
      }, 1000);
    }

    /* ========== FORM SUBMISSION ========== */
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const p1 = document.getElementById('regPassword').value;
      const p2 = document.getElementById('regConfirmPassword').value;

      if (p1 !== p2) {
        showToast('Passwords do not match. Please re-enter.');
        return;
      }

      const spinner = document.getElementById('regSpinner');
      const arrow = document.getElementById('regArrow');
      const btn = document.getElementById('regSubmitBtn');
      const btnText = document.getElementById('regBtnText');

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      arrow.style.display = 'none';
      btnText.textContent = 'Creating Account...';

      setTimeout(() => {
        showToast('Account created successfully! Redirecting to dashboard...');
        setTimeout(() => {
          if (selectedRole === 'agent') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'user-dashboard.html';
          }
        }, 1000);
      }, 900);
    }
